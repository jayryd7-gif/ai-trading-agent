name: World News Brief

on:
  schedule:
    # Time is UTC. 08:00 UTC is about 3-4 AM New York time, so the X drafts built
    # from it are ready before 6 AM (moved 2 hours earlier on 2026-10-25).
    # Every day. Weekend runs use fewer searches (WEEKEND_SEARCHES) to stay cheap.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # your private phone-alert topic
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Anthropic tool
        run: pip install anthropic

      - name: Write the world news brief
        shell: bash
        run: |
          mkdir -p reports/news
          python agents/world_news_brief.py 2>&1 | tee reports/news/last-run-log.txt
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Save the brief and the run log in the repo
        if: ${{ !cancelled() }}
        run: |
          git config user.name "news-agent"
          git config user.email "news-agent@users.noreply.github.com"
          git add reports/news reports/costs
          git commit -m "Add world news brief $(date -u +%F)" || echo "Nothing to commit"
          for attempt in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done

      - name: Phone alert if this run failed
        if: failure()
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -H "Title: World News Brief failed" -H "Priority: high" -H "Tags: warning" \
              -H "Click: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -d "The World News Brief run on GitHub failed. Tap to see what went wrong." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          fi
