name: Weekly Report

on:
  schedule:
    # Times are UTC. Sunday 22:00 UTC is 6 PM New York in summer, 5 PM in winter,
    # before the gold brief and the new week's first session.
    - cron: "0 22 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # your private phone-alert topic
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run a fresh CEO check, then write the weekly report
        run: |
          python agents/ceo.py
          python agents/weekly_report.py
        env:
          PYTHONPATH: .:agents

      - name: Save the report in the repo
        if: ${{ !cancelled() }}
        run: |
          git config user.name "weekly-report"
          git config user.email "weekly-report@users.noreply.github.com"
          git add reports/weekly reports/ceo
          git commit -m "Weekly report $(date -u +%F)" || echo "Nothing to commit"
          for attempt in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done

      - name: Phone alert if this run failed
        if: failure()
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -H "Title: Weekly Report failed" -H "Priority: high" -H "Tags: warning" \
              -H "Click: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -d "The Weekly Report run on GitHub failed. Tap to see what went wrong." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          fi
