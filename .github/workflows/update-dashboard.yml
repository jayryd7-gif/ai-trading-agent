name: Update Dashboard

on:
  workflow_run:
    workflows: ["Market Brief", "Score Briefs"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the dashboard
        run: python agents/dashboard.py

      - name: Save the dashboard in the repo
        run: |
          git config user.name "dashboard"
          git config user.email "dashboard@users.noreply.github.com"
          git add DASHBOARD.md
          git commit -m "Update dashboard" || echo "Nothing to commit"
          for attempt in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done
