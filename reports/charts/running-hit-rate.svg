<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="Helvetica, Arial, sans-serif"><rect x="0.5" y="0.5" width="639" height="299" rx="8" fill="#ffffff" stroke="#d0d7de"/><text x="20" y="28" font-size="16" font-weight="bold" fill="#1f2328">Running hit rate</text><text x="20" y="46" font-size="12" fill="#656d76">Share of decisive calls that were right, after each call. Needs 30+ calls to mean anything.</text><line x1="60" y1="240.0" x2="610" y2="240.0" stroke="#d0d7de"/><text x="52" y="244.0" font-size="11" text-anchor="end" fill="#656d76">0%</text><line x1="60" y1="197.5" x2="610" y2="197.5" stroke="#d0d7de"/><text x="52" y="201.5" font-size="11" text-anchor="end" fill="#656d76">25%</text><line x1="60" y1="155.0" x2="610" y2="155.0" stroke="#bf8700" stroke-dasharray="5 4"/><text x="52" y="159.0" font-size="11" text-anchor="end" fill="#656d76">50%</text><line x1="60" y1="112.5" x2="610" y2="112.5" stroke="#d0d7de"/><text x="52" y="116.5" font-size="11" text-anchor="end" fill="#656d76">75%</text><line x1="60" y1="70.0" x2="610" y2="70.0" stroke="#d0d7de"/><text x="52" y="74.0" font-size="11" text-anchor="end" fill="#656d76">100%</text><text x="68" y="150.0" font-size="11" fill="#bf8700">coin flip (50%)</text><polyline points="60.0,240.0 610.0,155.0" fill="none" stroke="#2da44e" stroke-width="2.5"/><circle cx="60.0" cy="240.0" r="3.5" fill="#2da44e"/><circle cx="610.0" cy="155.0" r="3.5" fill="#2da44e"/><text x="60" y="258" font-size="11" fill="#656d76">call 1</text><text x="610" y="258" font-size="11" text-anchor="end" fill="#656d76">call 2</text><text x="604.0" y="146.0" font-size="12" text-anchor="end" fill="#1f2328" font-weight="bold">50%</text></svg>