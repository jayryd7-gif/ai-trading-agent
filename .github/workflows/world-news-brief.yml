name: World News Brief

on:
  schedule:
    # Time is UTC. 10:00 UTC is about 5-6 AM New York time, before the market briefs.
    # Weekdays only, to keep the cost down. To run every day, change "1-5" to "*".
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Anthropic tool
        run: pip install anthropic

      - name: Write the world news brief
        shell: bash
        run: |
          mkdir -p reports/news
          python agents/world_news_brief.py 2>&1 | tee reports/news/last-run-log.txt
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Save the brief and the run log in the repo
        if: ${{ !cancelled() }}
        run: |
          git config user.name "news-agent"
          git config user.email "news-agent@users.noreply.github.com"
          git add reports/news
          git commit -m "Add world news brief $(date -u +%F)" || echo "Nothing to commit"
          for attempt in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done
