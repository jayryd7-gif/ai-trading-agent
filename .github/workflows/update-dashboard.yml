name: Update Dashboard

on:
  workflow_run:
    workflows: ["Market Brief", "Score Briefs", "Post-Session Review", "World News Brief", "Crypto Brief", "Stock Brief", "CEO Check", "Weekly Report"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # your private phone-alert topic
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the dashboard
        run: python agents/dashboard.py

      - name: Save the dashboard in the repo
        run: |
          git config user.name "dashboard"
          git config user.email "dashboard@users.noreply.github.com"
          git add DASHBOARD.md reports/charts
          git commit -m "Update dashboard" || echo "Nothing to commit"
          for attempt in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done

      - name: Phone alert if this run failed
        if: failure()
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -H "Title: Update Dashboard failed" -H "Priority: high" -H "Tags: warning" \
              -H "Click: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -d "The Update Dashboard run on GitHub failed. Tap to see what went wrong." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          fi
