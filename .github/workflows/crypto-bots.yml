name: Crypto Bots

on:
  schedule:
    # Times are UTC. Daily candles close at 00:00 UTC (8 PM New York in summer,
    # 7 PM in winter); this runs shortly after, every day of the week.
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the crypto bots and build the crypto dashboard
        run: python crypto/crypto_bots.py

      - name: Copy the rotation bot into the Alpaca paper account
        run: python crypto/alpaca_sync.py
        env:
          # Accepts the secrets spelled ALPACA_... or ALPADA_...
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID || secrets.ALPADA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY || secrets.ALPADA_SECRET_KEY }}

      - name: Save the results in the repo
        if: ${{ !cancelled() }}
        run: |
          git config user.name "crypto-bots"
          git config user.email "crypto-bots@users.noreply.github.com"
          git add CRYPTO-DASHBOARD.md crypto   # crypto/cache is ignored
          git commit -m "Update crypto bots $(date -u +%F)" || echo "Nothing to commit"
          for attempt in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done
