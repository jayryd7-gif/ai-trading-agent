name: Post-Session Review

on:
  schedule:
    # Times are UTC. Shortly after the scorer, once each session has ended.
    - cron: "45 21 * * 1-5"   # Nasdaq session just ended (about 4:45-5:45 PM NY)
    - cron: "45 10 * * 1-5"   # Asia session ended at 08:00 UTC (about 3-4 AM NY)
  workflow_dispatch:
    inputs:
      instrument:
        description: "Which session to review"
        type: choice
        options:
          - nasdaq
          - gold
        default: nasdaq

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # your private phone-alert topic
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install anthropic yfinance

      - name: Decide which session to review
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "instrument=${{ inputs.instrument }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "45 21 * * 1-5" ]; then
            echo "instrument=nasdaq" >> "$GITHUB_OUTPUT"
          else
            echo "instrument=gold" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the review
        run: python agents/post_session_review.py ${{ steps.pick.outputs.instrument }}
        env:
          PYTHONPATH: .
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Write the no-trade journal entry
        if: ${{ !cancelled() }}
        run: python agents/no_trade_journal.py ${{ steps.pick.outputs.instrument }}
        env:
          PYTHONPATH: .
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Save the results in the repo
        if: ${{ !cancelled() }}
        run: |
          git config user.name "review-agent"
          git config user.email "review-agent@users.noreply.github.com"
          git add reports/reviews no-trade-journal.md reports/costs
          git commit -m "Add ${{ steps.pick.outputs.instrument }} review and journal entry" || echo "Nothing to commit"
          for attempt in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done

      - name: Phone alert if this run failed
        if: failure()
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -H "Title: Post-Session Review failed" -H "Priority: high" -H "Tags: warning" \
              -H "Click: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -d "The Post-Session Review run on GitHub failed. Tap to see what went wrong." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          fi
