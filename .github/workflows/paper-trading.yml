name: Paper Trading

on:
  schedule:
    # Times are UTC. Every 15 minutes while a session is open, so each paper
    # trade is recorded soon after it closes. GitHub can start scheduled runs
    # a few minutes late.
    - cron: "*/15 13-21 * * 1-5"   # Nasdaq: 9:30 AM-4 PM New York, summer and winter
    - cron: "*/15 0-8 * * 1-5"     # Gold: Tokyo session, 00:00-08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # your private phone-alert topic
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install yfinance

      - name: Record any paper trades that have closed
        run: python agents/paper_trader.py
        env:
          PYTHONPATH: .

      - name: Save new results and refresh the dashboard
        if: ${{ !cancelled() }}
        run: |
          # The summary's timestamp changes every run; only save real changes.
          if git diff --quiet -- paper-trading/trades.csv paper-trading/paper-journal.md \
                                 paper-trading/open-trades.json \
             && git ls-files --error-unmatch paper-trading/trades.csv >/dev/null 2>&1; then
            echo "No new sessions recorded"
            exit 0
          fi
          python agents/dashboard.py
          git config user.name "paper-trader"
          git config user.email "paper-trader@users.noreply.github.com"
          git add paper-trading DASHBOARD.md reports/charts
          git commit -m "Record paper trades $(date -u +'%F %H:%M')"
          for attempt in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done

      - name: Phone alert if this run failed
        if: failure()
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -H "Title: Paper Trading failed" -H "Priority: high" -H "Tags: warning" \
              -H "Click: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -d "The Paper Trading run on GitHub failed. Tap to see what went wrong." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          fi
