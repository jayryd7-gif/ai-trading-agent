name: X Post Drafts

on:
  schedule:
    # Time is UTC. 09:00 UTC is about 4-5 AM New York time, after the world,
    # crypto and stock briefs, so the drafts are on X-DASHBOARD.md before 6 AM
    # (GitHub sometimes starts scheduled runs up to ~20 minutes late).
    - cron: "0 9 * * *"
    # Evening thread at 6:30 PM New York time (what happened today, what to watch
    # tomorrow), so it is ready before the 7 PM reminder. Two UTC times so it is
    # 6:30 PM in both summer and winter time; the run that isn't 6 PM in New
    # York stops at once.
    - cron: "30 22 * * *"
    - cron: "30 23 * * *"
    # Phone reminder at 7 PM New York time to post the evening thread (no AI, $0).
    # Same two-time trick for summer and winter time.
    - cron: "0 23 * * *"
    - cron: "0 0 * * *"
  # All can still be run by hand from the Actions tab.
  workflow_dispatch:
    inputs:
      mode:
        description: "morning, evening or remind"
        default: "morning"

permissions:
  contents: write

jobs:
  drafts:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # your private phone-alert topic
      SCHEDULE: ${{ github.event.schedule }}
      INPUT_MODE: ${{ inputs.mode }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Anthropic tool and Yahoo Finance
        run: pip install anthropic yfinance

      - name: Write the X drafts (or send the 7 PM reminder)
        shell: bash
        run: |
          mkdir -p reports/x-posts
          case "$SCHEDULE" in
            "30 22 * * *"|"30 23 * * *") MODE=evening; HOURS="18 19" ;;
            "0 23 * * *"|"0 0 * * *")    MODE=remind;  HOURS="19" ;;
            "")                          MODE="${INPUT_MODE:-morning}"; HOURS="" ;;
            *)                           MODE=morning; HOURS="" ;;
          esac
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          NOW_HOUR="$(TZ=America/New_York date +%H)"
          if [ -n "$HOURS" ] && [[ " $HOURS " != *" $NOW_HOUR "* ]]; then
            echo "It is ${NOW_HOUR}:xx in New York, not the right hour (summer/winter time), so this run stops here."
            exit 0
          fi
          if [ "$MODE" = "remind" ]; then
            python agents/x_posts.py --remind
          elif [ "$MODE" = "evening" ] && [ -n "$SCHEDULE" ]; then
            # a late or second scheduled run skips if tonight's thread is already written
            python agents/x_posts.py --evening --if-missing 2>&1 | tee reports/x-posts/last-run-log.txt
          elif [ "$MODE" = "evening" ] || [ "$MODE" = "close" ]; then
            python agents/x_posts.py --evening 2>&1 | tee reports/x-posts/last-run-log.txt
          else
            python agents/x_posts.py 2>&1 | tee reports/x-posts/last-run-log.txt
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Save the drafts and the run log in the repo
        if: ${{ !cancelled() }}
        run: |
          git config user.name "x-posts-agent"
          git config user.email "x-posts-agent@users.noreply.github.com"
          git add reports/x-posts reports/costs
          git add X-DASHBOARD.md 2>/dev/null || true
          git commit -m "Add X drafts ($MODE) $(date -u +%F)" || echo "Nothing to commit"
          for attempt in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done

      - name: Phone alert if this run failed
        if: failure()
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -H "Title: X Post Drafts failed" -H "Priority: high" -H "Tags: warning" \
              -H "Click: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -d "The X Post Drafts run on GitHub failed. Tap to see what went wrong." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          fi
