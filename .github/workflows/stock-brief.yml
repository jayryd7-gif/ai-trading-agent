name: Stock Brief

on:
  schedule:
    # Time is UTC. 08:40 UTC is about 3:40-4:40 AM New York time, before the open
    # (early so the X drafts are ready before 6 AM).
    # Monday, Wednesday and Friday only, to keep the cost down. The earnings
    # table looks two weeks ahead, so nothing is missed in between.
    # To run every weekday, change "1,3,5" to "1-5".
    - cron: "40 8 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stocks:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # your private phone-alert topic
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install anthropic yfinance

      - name: Write the stock research brief
        shell: bash
        run: |
          mkdir -p reports/stocks
          python agents/stock_research.py 2>&1 | tee reports/stocks/last-run-log.txt
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Save the brief and the run log in the repo
        if: ${{ !cancelled() }}
        run: |
          git config user.name "stock-agent"
          git config user.email "stock-agent@users.noreply.github.com"
          git add reports/stocks reports/costs
          git commit -m "Add stock brief $(date -u +%F)" || echo "Nothing to commit"
          for attempt in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done

      - name: Phone alert if this run failed
        if: failure()
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -H "Title: Stock Brief failed" -H "Priority: high" -H "Tags: warning" \
              -H "Click: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              -d "The Stock Brief run on GitHub failed. Tap to see what went wrong." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          fi
